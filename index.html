<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLX 투어 자동 내레이션 프로그램</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; text-align: center; padding: 20px; background-color: #f8f9fa; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #00529b; margin-bottom: 5px; }
        p.subtitle { color: #7f8c8d; font-size: 14px; margin-bottom: 20px; }
        .btn-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        button { padding: 15px 20px; font-size: 16px; font-weight: bold; background-color: #00529b; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 10px; }
        button.lang-btn { width: auto; padding: 10px 20px; background-color: #28a745; margin-bottom: 0; }
        
        .control-panel { display: none; gap: 10px; margin-bottom: 15px; }
        .control-btn { padding: 10px; font-size: 14px; background-color: #6c757d; margin-bottom: 0; }
        .control-btn.skip { background-color: #e67e22; }

        .location-list-box { max-height: 400px; overflow-y: auto; margin-top: 15px; padding-right: 5px; }
        .location-card { background: #ecf0f1; margin-bottom: 10px; padding: 15px; border-radius: 8px; text-align: left; transition: all 0.3s ease; }
        .location-header { display: flex; justify-content: space-between; align-items: center; }
        .location-name { font-weight: bold; font-size: 16px; color: #2c3e50; }
        .status-text { font-size: 13px; font-weight: bold; color: #7f8c8d; margin-top: 5px; }
        .completed { background: #d4efdf; border-left: 5px solid #27ae60; }
        .active { background: #fff3cd; border-left: 5px solid #f39c12; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🚌 CLX 투어 자동 내레이션</h2>
        <p class="subtitle">버스 이동 경로에 맞춰 13개 주요 포인트의 안내가 자동 재생됩니다.</p>
        
        <button id="mainStartBtn" onclick="initiateTourStart()">투어 시작하기</button>

        <div id="languageSelection" style="display: none;">
            <h3>언어를 선택해주세요:</h3>
            <div class="btn-group">
                <button class="lang-btn" onclick="setLanguageAndStartTour('ko')">한국어</button>
                <button class="lang-btn" onclick="setLanguageAndStartTour('en')">English</button>
                <button class="lang-btn" onclick="setLanguageAndStartTour('jp')">日本語</button>
            </div>
        </div>

        <div id="controlPanel" class="control-panel">
            <button class="control-btn" onclick="replayCurrentAudio()">↺ 음성 다시듣기</button>
            <button class="control-btn skip" onclick="skipToNextLocation()">⏭️ 다음 장소 스킵</button>
        </div>

        <div id="location-list" class="location-list-box"></div>
    </div>

    <audio id="playerAudio" preload="auto"></audio>

    <script>
        // 🚨 13번 장소의 실제 이름 및 위도(lat), 경도(lon)로 수정해 주세요.
        const LOCATIONS = [
            { id: 1, name: "1. 인사말", lat: 35.51028, lon: 129.34730, played: false },
            { id: 2, name: "2. #1 BTX", lat: 35.50834, lon: 129.34945, played: false },
            { id: 3, name: "3. 제1정유공장", lat: 35.50720, lon: 129.35203, played: false },
            { id: 4, name: "4. 윤활유공장", lat: 35.50457, lon: 129.35776, played: false },
            { id: 5, name: "5. 파이프라인", lat: 35.50445, lon: 129.36086, played: false },
            { id: 6, name: "6. 내항부두", lat: 35.50121, lon: 129.36484, played: false },
            { id: 7, name: "7. 장거리송유관", lat: 35.50462, lon: 129.35786, played: false },
            { id: 8, name: "8. 제2수처리장", lat: 35.50549, lon: 129.35591, played: false },
            { id: 9, name: "9. 소방시설", lat: 35.50636, lon: 129.35422, played: false },
            { id: 10, name: "10. #2VRDS", lat: 35.50720, lon: 129.35205, played: false },
            { id: 11, name: "11. 조정실", lat: 35.50809, lon: 129.35024, played: false },
            { id: 12, name: "12. 상생복지관", lat: 35.50868, lon: 129.34894, played: false },
            { id: 13, name: "13. 작별인사", lat: 35.50966, lon: 129.34787, played: false }
        ];

        const TRIGGER_RADIUS_METERS = 50; 
        
        const listContainer = document.getElementById('location-list');
        const mainStartBtn = document.getElementById('mainStartBtn');
        const languageSelectionDiv = document.getElementById('languageSelection');
        const controlPanel = document.getElementById('controlPanel');
        const playerAudio = document.getElementById('playerAudio');

        let watchId = null;
        let currentTargetIndex = 0; 
        let selectedLanguage = ''; 
        let wakeLock = null;

        // 파일명 규칙: audio_ko_1.mp3 ~ audio_ko_13.mp3
        function getAudioFileName(locationId, lang) {
            return `audio_${lang}_${locationId}.mp3`;
        }

        function initUI() {
            listContainer.innerHTML = '';
            LOCATIONS.forEach(location => {
                const div = document.createElement('div');
                div.className = 'location-card';
                div.id = `card-${location.id}`;
                div.innerHTML = `
                    <div class="location-header">
                        <span class="location-name">${location.name}</span>
                    </div>
                    <div class="status-text" id="status-${location.id}">대기 중</div>
                `;
                listContainer.appendChild(div);
            });
        }
        initUI();

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        function initiateTourStart() {
            if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                alert("⚠️ 경고: GPS 기능은 HTTPS 보안 웹페이지 주소에서만 정상 동작합니다.");
            }

            if (!navigator.geolocation) {
                alert("이 기기는 GPS를 지원하지 않습니다.");
                return;
            }

            mainStartBtn.style.display = 'none'; 
            languageSelectionDiv.style.display = 'block';
        }

        async function setLanguageAndStartTour(lang) {
            selectedLanguage = lang;
            languageSelectionDiv.style.display = 'none';
            mainStartBtn.style.display = 'block';
            controlPanel.style.display = 'flex';

            try {
                playerAudio.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
                await playerAudio.play();
                playerAudio.pause();
            } catch (e) {}

            requestWakeLock();

            if (LOCATIONS.length > 0) {
                updateCardActive(LOCATIONS[0].id, "목적지로 이동 중...");
            }

            startGPSMonitoring();
        }

        function startGPSMonitoring() {
            const options = { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 };

            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    if (currentTargetIndex >= LOCATIONS.length) {
                        mainStartBtn.innerText = "🎉 모든 CLX 투어가 완료되었습니다!";
                        mainStartBtn.style.backgroundColor = "#27ae60";
                        releaseWakeLock();
                        return;
                    }

                    const currentLat = position.coords.latitude;
                    const currentLon = position.coords.longitude;
                    const accuracy = Math.round(position.coords.accuracy);

                    const location = LOCATIONS[currentTargetIndex];
                    const distance = Math.round(getDistance(currentLat, currentLon, location.lat, location.lon));

                    mainStartBtn.innerText = `🚌 수신 중 (오차 ±${accuracy}m) | 타겟: ${location.id}번`;
                    mainStartBtn.style.backgroundColor = "#00529b";

                    if (distance <= TRIGGER_RADIUS_METERS && !location.played) {
                        playLocationAudio(location);
                    } else if (!location.played) {
                        const statusEl = document.getElementById(`status-${location.id}`);
                        statusEl.innerText = `🚌 이동 중... (남은 거리: 약 ${distance}m / 오차범위: ±${accuracy}m)`;
                        statusEl.style.color = "#d35400";
                    }
                },
                (error) => {
                    let errMessage = "GPS 신호 탐색 중...";
                    if (error.code === 1) errMessage = "⚠️ 위치 권한이 거부되었습니다.";
                    else if (error.code === 2) errMessage = "⚠️ GPS 위치를 찾을 수 없습니다.";
                    else if (error.code === 3) errMessage = "⚠️ GPS 수신 시간 초과 (재시도 중)";

                    mainStartBtn.innerText = errMessage;
                    mainStartBtn.style.backgroundColor = "#e74c3c";
                },
                options
            );
        }

        function playLocationAudio(location) {
            location.played = true;
            
            playerAudio.src = getAudioFileName(location.id, selectedLanguage);
            playerAudio.play().catch(err => console.error(err));

            const statusEl = document.getElementById(`status-${location.id}`);
            const cardEl = document.getElementById(`card-${location.id}`);
            
            statusEl.innerText = "✅ 도착! 안내 방송 재생 중...";
            statusEl.style.color = "#27ae60";
            cardEl.classList.remove("active");
            cardEl.classList.add("completed");

            currentTargetIndex++;
            if (currentTargetIndex < LOCATIONS.length) {
                const nextLoc = LOCATIONS[currentTargetIndex];
                updateCardActive(nextLoc.id, "다음 장소로 이동 중...");
                document.getElementById(`card-${nextLoc.id}`).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function replayCurrentAudio() {
            if (currentTargetIndex > 0) {
                const prevLoc = LOCATIONS[currentTargetIndex - 1];
                playerAudio.src = getAudioFileName(prevLoc.id, selectedLanguage);
                playerAudio.play();
            } else {
                alert("아직 재생된 안내 음성이 없습니다.");
            }
        }

        function skipToNextLocation() {
            if (currentTargetIndex < LOCATIONS.length) {
                const currentLoc = LOCATIONS[currentTargetIndex];
                if (confirm(`'${currentLoc.name}'을(를) 건너뛰고 다음 장소로 이동하시겠습니까?`)) {
                    currentLoc.played = true;
                    const cardEl = document.getElementById(`card-${currentLoc.id}`);
                    const statusEl = document.getElementById(`status-${currentLoc.id}`);
                    
                    statusEl.innerText = "⏭️ 건너뜀 (스킵됨)";
                    statusEl.style.color = "#7f8c8d";
                    cardEl.classList.remove("active");

                    currentTargetIndex++;
                    if (currentTargetIndex < LOCATIONS.length) {
                        const nextLoc = LOCATIONS[currentTargetIndex];
                        updateCardActive(nextLoc.id, "다음 장소로 이동 중...");
                    }
                }
            }
        }

        function updateCardActive(id, message) {
            const cardEl = document.getElementById(`card-${id}`);
            const statusEl = document.getElementById(`status-${id}`);
            if (cardEl && statusEl) {
                cardEl.classList.add("active");
                statusEl.innerText = message;
                statusEl.style.color = "#f39c12";
            }
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) { wakeLock.release(); wakeLock = null; }
        }
    </script>
</body>
</html>
